---

- name: 'linux apps proxmox : install extension script'
  become: true
  get_url:
    url: >-
      https://raw.githubusercontent.com/librenms/librenms-agent/master/agent-local/proxmox
    dest: '{{ snmp_application_extension_scripts }}/proxmox'
    owner: root
    group: "{{ snmp_deamon_group | default('root') }}"
    mode: '0755'
    seuser: system_u
    serole: object_r
    setype: lib_t
    selevel: s0
  when: snmp_application_discovery.proxmox
  notify:
    - refresh proxmox cache

- name: 'linux apps proxmox : create cache directory'
  become: true
  file:
    path: '{{ snmp_application_cache_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - snmp_application_discovery.proxmox
    - snmp_application_discovery.systemd
  notify:
    - refresh proxmox cache

- name: 'linux apps proxmox : install common systemd service'
  become: true
  template:
    src: systemd/librenms-snmp-extension@.service.j2
    dest: /etc/systemd/system/librenms-snmp-extension@.service
    owner: root
    group: root
    mode: '0644'
  when:
    - snmp_application_discovery.proxmox
    - snmp_application_discovery.systemd
  notify:
    - reload systemd

- name: 'linux apps proxmox : install common systemd timer'
  become: true
  template:
    src: systemd/librenms-snmp-extension@.timer.j2
    dest: /etc/systemd/system/librenms-snmp-extension@.timer
    owner: root
    group: root
    mode: '0644'
  when:
    - snmp_application_discovery.proxmox
    - snmp_application_discovery.systemd
  notify:
    - reload systemd

- name: 'linux apps proxmox : create systemd override directory'
  become: true
  file:
    path: /etc/systemd/system/librenms-snmp-extension@proxmox.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - snmp_application_discovery.proxmox
    - snmp_application_discovery.systemd
  notify:
    - reload systemd
    - refresh proxmox cache

- name: 'linux apps proxmox : install systemd override'
  become: true
  template:
    src: systemd/librenms-snmp-extension-proxmox-override.conf.j2
    dest: /etc/systemd/system/librenms-snmp-extension@proxmox.service.d/override.conf
    owner: root
    group: root
    mode: '0644'
  when:
    - snmp_application_discovery.proxmox
    - snmp_application_discovery.systemd
  notify:
    - reload systemd
    - refresh proxmox cache

- name: 'linux apps proxmox : enable cache refresh timer'
  become: true
  systemd:
    name: librenms-snmp-extension@proxmox.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - snmp_application_discovery.proxmox
    - snmp_application_discovery.systemd

- name: 'linux apps proxmox : check cache file'
  become: true
  stat:
    path: '{{ snmp_application_proxmox_cache_file }}'
  register: snmp_application_proxmox_cache_stat
  when:
    - snmp_application_discovery.proxmox
    - snmp_application_discovery.systemd

- name: 'linux apps proxmox : queue cache refresh'
  become: true
  command:
    argv:
      - /bin/true
  changed_when: true
  when:
    - snmp_application_discovery.proxmox
    - snmp_application_discovery.systemd
    - not snmp_application_proxmox_cache_stat.stat.exists
  notify:
    - refresh proxmox cache

- name: 'linux apps proxmox : install cached snmpd include snippet'
  become: true
  template:
    src: snmp/proxmox-cached.conf.j2
    dest: '{{ snmp_config_include_dir }}/proxmox.conf'
    owner: root
    group: root
    mode: '0640'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when:
    - snmp_application_discovery.proxmox
    - snmp_application_discovery.systemd
  notify:
    - restart snmp

- name: 'linux apps proxmox : install direct snmpd include snippet'
  become: true
  template:
    src: snmp/proxmox-direct.conf.j2
    dest: '{{ snmp_config_include_dir }}/proxmox.conf'
    owner: root
    group: root
    mode: '0640'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when:
    - snmp_application_discovery.proxmox
    - not snmp_application_discovery.systemd
  notify:
    - restart snmp

- name: 'linux apps proxmox : disable stale cache refresh timer'
  become: true
  systemd:
    name: librenms-snmp-extension@proxmox.timer
    enabled: false
    state: stopped
    daemon_reload: true
  failed_when: false
  when:
    - not snmp_application_discovery.proxmox
    - snmp_application_discovery.systemd

- name: 'linux apps proxmox : remove stale systemd override'
  become: true
  file:
    path: /etc/systemd/system/librenms-snmp-extension@proxmox.service.d
    state: absent
  when:
    - not snmp_application_discovery.proxmox
    - snmp_application_discovery.systemd
  notify:
    - reload systemd

- name: 'linux apps proxmox : remove stale cache file'
  become: true
  file:
    path: '{{ snmp_application_proxmox_cache_file }}'
    state: absent
  when: not snmp_application_discovery.proxmox

- name: 'linux apps proxmox : remove stale snmpd include snippet'
  become: true
  file:
    path: '{{ snmp_config_include_dir }}/proxmox.conf'
    state: absent
  when: not snmp_application_discovery.proxmox
  notify:
    - restart snmp
