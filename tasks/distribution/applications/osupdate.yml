---

- name: 'linux apps osupdate : install extension script'
  become: true
  get_url:
    url: >-
      https://raw.githubusercontent.com/librenms/librenms-agent/master/snmp/osupdate
    dest: '{{ snmp_application_extension_scripts }}/osupdate'
    owner: root
    group: "{{ snmp_deamon_group | default('root') }}"
    mode: '0755'
    seuser: system_u
    serole: object_r
    setype: lib_t
    selevel: s0
  when: snmp_application_discovery.osupdate

- name: 'linux apps osupdate : install snmpd include snippet'
  become: true
  copy:
    content: |
      extend osupdate {{ snmp_application_extension_scripts }}/osupdate
    dest: '{{ snmp_config_include_dir }}/osupdate.conf'
    owner: root
    group: root
    mode: '0640'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when: snmp_application_discovery.osupdate
  notify:
    - restart snmp

- name: 'linux apps osupdate : remove stale snmpd include snippet'
  become: true
  file:
    path: '{{ snmp_config_include_dir }}/osupdate.conf'
    state: absent
  when: not snmp_application_discovery.osupdate
  notify:
    - restart snmp
