---

- name: 'linux apps chronyd : install extension script'
  become: true
  get_url:
    url: >-
      https://raw.githubusercontent.com/librenms/librenms-agent/master/snmp/chrony
    dest: '{{ snmp_application_extension_scripts }}/chrony'
    owner: root
    group: "{{ snmp_deamon_group | default('root') }}"
    mode: '0755'
    seuser: system_u
    serole: object_r
    setype: lib_t
    selevel: s0
  when: snmp_application_discovery.chronyd

- name: 'linux apps chronyd : install snmpd include snippet'
  become: true
  copy:
    content: |
      extend chronyd {{ snmp_application_extension_scripts }}/chrony
    dest: '{{ snmp_config_include_dir }}/chronyd.conf'
    owner: root
    group: root
    mode: '0640'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when: snmp_application_discovery.chronyd
  notify:
    - restart snmp

- name: 'linux apps chronyd : remove stale snmpd include snippet'
  become: true
  file:
    path: '{{ snmp_config_include_dir }}/chronyd.conf'
    state: absent
  when: not snmp_application_discovery.chronyd
  notify:
    - restart snmp
