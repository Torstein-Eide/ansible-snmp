---

- name: 'linux apps mdadm : install extension script'
  become: true
  get_url:
    url: >-
      https://raw.githubusercontent.com/librenms/librenms-agent/master/snmp/mdadm
    dest: '{{ snmp_application_extension_scripts }}/mdadm'
    owner: root
    group: "{{ snmp_deamon_group | default('root') }}"
    mode: '0755'
    seuser: system_u
    serole: object_r
    setype: lib_t
    selevel: s0
  when: snmp_application_discovery.mdadm

- name: 'linux apps mdadm : install snmpd include snippet'
  become: true
  copy:
    content: |
      extend mdadm {{ snmp_application_extension_scripts }}/mdadm
    dest: '{{ snmp_config_include_dir }}/mdadm.conf'
    owner: root
    group: root
    mode: '0640'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when: snmp_application_discovery.mdadm
  notify:
    - restart snmp

- name: 'linux apps mdadm : remove stale snmpd include snippet'
  become: true
  file:
    path: '{{ snmp_config_include_dir }}/mdadm.conf'
    state: absent
  when: not snmp_application_discovery.mdadm
  notify:
    - restart snmp
