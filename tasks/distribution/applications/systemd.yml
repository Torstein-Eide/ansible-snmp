---

- name: 'linux apps systemd : install extension script'
  become: true
  get_url:
    url: >-
      https://raw.githubusercontent.com/librenms/librenms-agent/master/snmp/systemd.py
    dest: '{{ snmp_application_extension_scripts }}/systemd.py'
    owner: root
    group: "{{ snmp_deamon_group | default('root') }}"
    mode: '0755'
    seuser: system_u
    serole: object_r
    setype: lib_t
    selevel: s0
  when: snmp_application_discovery.systemd

- name: 'linux apps systemd : install snmpd include snippet'
  become: true
  copy:
    content: >
      {{ 'extend systemd /bin/python3 '
         ~ snmp_application_extension_scripts ~ '/systemd.py' }}
    dest: '{{ snmp_config_include_dir }}/systemd.conf'
    owner: root
    group: root
    mode: '0640'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when: snmp_application_discovery.systemd
  notify:
    - restart snmp

- name: 'linux apps systemd : remove stale snmpd include snippet'
  become: true
  file:
    path: '{{ snmp_config_include_dir }}/systemd.conf'
    state: absent
  when: not snmp_application_discovery.systemd
  notify:
    - restart snmp
