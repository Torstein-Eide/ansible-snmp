---

- name: 'linux apps borgbackup : install extension script'
  become: true
  get_url:
    url: >-
      https://raw.githubusercontent.com/librenms/librenms-agent/master/snmp/borgbackup
    dest: '{{ snmp_application_extension_scripts }}/borgbackup'
    owner: root
    group: "{{ snmp_deamon_group | default('root') }}"
    mode: '0755'
    seuser: system_u
    serole: object_r
    setype: lib_t
    selevel: s0
  when: snmp_application_discovery.borgbackup

- name: 'linux apps borgbackup : create cache directory'
  become: true
  file:
    path: /var/cache/borgbackup_extend
    state: directory
    owner: "{{ snmp_deamon_user | default('root') }}"
    group: "{{ snmp_deamon_group | default('root') }}"
    mode: '0755'
  when: snmp_application_discovery.borgbackup

- name: 'linux apps borgbackup : install snmpd include snippet'
  become: true
  copy:
    content: |
      extend borgbackup /bin/cat /var/cache/borgbackup_extend/extend_return
    dest: '{{ snmp_config_include_dir }}/borgbackup.conf'
    owner: root
    group: root
    mode: '0640'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when: snmp_application_discovery.borgbackup
  notify:
    - restart snmp

- name: 'linux apps borgbackup : remove stale snmpd include snippet'
  become: true
  file:
    path: '{{ snmp_config_include_dir }}/borgbackup.conf'
    state: absent
  when: not snmp_application_discovery.borgbackup
  notify:
    - restart snmp
