---

- name: 'linux apps nfs : install extension script'
  become: true
  get_url:
    url: >-
      https://raw.githubusercontent.com/librenms/librenms-agent/master/snmp/nfs
    dest: '{{ snmp_application_extension_scripts }}/nfs'
    owner: root
    group: "{{ snmp_deamon_group | default('root') }}"
    mode: '0755'
    seuser: system_u
    serole: object_r
    setype: lib_t
    selevel: s0
  when: snmp_application_discovery.nfs

- name: 'linux apps nfs : install snmpd include snippet'
  become: true
  copy:
    content: >-
      {{ 'extend nfs /usr/bin/env '
         ~ 'PATH=/sbin:/bin:/usr/sbin:/usr/bin:/usr/local/sbin:/usr/local/bin '
         ~ snmp_application_extension_scripts ~ '/nfs\n' }}
    dest: '{{ snmp_config_include_dir }}/nfs.conf'
    owner: root
    group: root
    mode: '0640'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when: snmp_application_discovery.nfs
  notify:
    - restart snmp

- name: 'linux apps nfs : remove stale snmpd include snippet'
  become: true
  file:
    path: '{{ snmp_config_include_dir }}/nfs.conf'
    state: absent
  when: not snmp_application_discovery.nfs
  notify:
    - restart snmp
