---

- name: 'linux apps validate : check extend output through snmp'
  command:
    argv:
      - snmpget
      - -v3
      - -l
      - authPriv
      - -u
      - '{{ snmp_user }}'
      - -a
      - SHA
      - -A
      - '{{ snmp_password }}'
      - -x
      - AES
      - -X
      - '{{ snmp_encryption }}'
      - -Oqv
      - '{{ snmp_application_validate_snmp_host }}'
      - '{{ item.oid }}'
  register: snmp_application_validate_result
  changed_when: false
  failed_when: >-
    snmp_application_validate_result.rc != 0 or
    (snmp_application_validate_result.stdout | trim | length) == 0 or
    'No Such' in snmp_application_validate_result.stdout or
    'Timeout' in snmp_application_validate_result.stderr
  loop:
    - key: apache
      name: apache
      oid: .1.3.6.1.4.1.8072.1.3.2.3.1.2.6.97.112.97.99.104.101
      enabled: '{{ snmp_application_apache_enabled }}'
    - key: nginx
      name: nginx
      oid: .1.3.6.1.4.1.8072.1.3.2.3.1.2.5.110.103.105.110.120
      enabled: '{{ snmp_application_nginx_enabled }}'
    - key: mysql
      name: mysql
      oid: .1.3.6.1.4.1.8072.1.3.2.3.1.2.5.109.121.115.113.108
      enabled: '{{ snmp_application_mysql_enabled }}'
    - key: redis
      name: redis
      oid: .1.3.6.1.4.1.8072.1.3.2.3.1.2.5.114.101.100.105.115
      enabled: '{{ snmp_application_redis_enabled }}'
    - key: memcached
      name: memcached
      oid: >-
        .1.3.6.1.4.1.8072.1.3.2.3.1.2.9.109.101.109.99.97.99.104.101.100
      enabled: '{{ snmp_application_memcached_enabled }}'
    - key: fail2ban
      name: fail2ban
      oid: >-
        .1.3.6.1.4.1.8072.1.3.2.3.1.2.8.102.97.105.108.50.98.97.110
      enabled: '{{ snmp_application_fail2ban_enabled }}'
    - key: chronyd
      name: chronyd
      oid: >-
        .1.3.6.1.4.1.8072.1.3.2.3.1.2.7.99.104.114.111.110.121.100
      enabled: '{{ snmp_application_chronyd_enabled }}'
    - key: docker
      name: docker
      oid: .1.3.6.1.4.1.8072.1.3.2.3.1.2.6.100.111.99.107.101.114
      enabled: '{{ snmp_application_docker_enabled }}'
    - key: systemd
      name: systemd
      oid: >-
        .1.3.6.1.4.1.8072.1.3.2.3.1.2.7.115.121.115.116.101.109.100
      enabled: '{{ snmp_application_systemd_enabled }}'
    - key: mdadm
      name: mdadm
      oid: .1.3.6.1.4.1.8072.1.3.2.3.1.2.5.109.100.97.100.109
      enabled: '{{ snmp_application_mdadm_enabled }}'
    - key: nfs
      name: nfs
      oid: .1.3.6.1.4.1.8072.1.3.2.3.1.2.3.110.102.115
      enabled: '{{ snmp_application_nfs_enabled }}'
    - key: osupdate
      name: osupdate
      oid: >-
        .1.3.6.1.4.1.8072.1.3.2.3.1.2.8.111.115.117.112.100.97.116.101
      enabled: '{{ snmp_application_osupdate_enabled }}'
    - key: pihole
      name: pi-hole
      oid: >-
        .1.3.6.1.4.1.8072.1.3.2.3.1.2.7.112.105.45.104.111.108.101
      enabled: '{{ snmp_application_pihole_enabled }}'
    - key: proxmox
      name: proxmox
      oid: >-
        .1.3.6.1.4.1.8072.1.3.2.3.1.2.7.112.114.111.120.109.111.120
      enabled: '{{ snmp_application_proxmox_enabled }}'
    - key: ups_nut
      name: ups-nut
      oid: >-
        .1.3.6.1.4.1.8072.1.3.2.3.1.2.7.117.112.115.45.110.117.116
      enabled: '{{ snmp_application_ups_nut_enabled }}'
  when:
    - item.enabled | bool
    - snmp_application_discovery[item.key] | bool
