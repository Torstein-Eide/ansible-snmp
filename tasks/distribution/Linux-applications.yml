---
# Dispatch LibreNMS SNMP application extends individually.

- name: 'linux apps : discover installed applications'
  include_tasks: applications-discovery.yml

- name: 'linux apps : create application extension directory'
  become: true
  file:
    path: '{{ snmp_application_extension_scripts }}'
    state: directory
    owner: root
    group: "{{ snmp_deamon_group | default('root') }}"
    mode: '0755'
    seuser: system_u
    serole: object_r
    setype: lib_t
    selevel: s0

- name: 'linux apps : install tmpfiles.d entry for extension cache directory'
  become: true
  copy:
    content: |
      d {{ snmp_application_cache_dir }} 0755 root root -
    dest: /etc/tmpfiles.d/librenms-snmp-extension.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - apply tmpfiles

- name: 'linux apps : create extension cache directory'
  become: true
  file:
    path: '{{ snmp_application_cache_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

# Each extension runs only when the application is discovered (to install or
# update it) or when a managed snmpd snippet is still present (to clean it up
# after the application was removed). When neither is true there is nothing to
# do, so the whole include is skipped to keep the run short.

- name: 'linux apps : configure apache extension'
  include_tasks: applications/apache.yml
  when:
    - snmp_application_apache_enabled
    - snmp_application_discovery.apache or 'apache.conf' in snmp_application_snippets_present

