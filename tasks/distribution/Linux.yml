---
# tasks file for sbaerlocher.snmp

- name: 'linux : install snmp'
  become: true
  package:
    name: '{{ item }}'
  with_items:
    - '{{ snmp_packages }}'
    - '{{ snmp_additional_packages }}'
  tags:
    - packages

- name: 'linux : create snmp extension directory'
  become: true
  file:
    path: '{{ snmp_extension_scripts }}'
    state: directory
    owner: root
    group: "{{ snmp_deamon_group | default('root') }}"
    mode: 0755
    seuser: system_u
    serole: object_r
    setype: lib_t
    selevel: s0
  tags:
    - configuration

- name: 'linux : create snmp config include directory'
  become: true
  file:
    path: '{{ snmp_config_include_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0750'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when: snmp_config_include_dir_enabled
  tags:
    - configuration

- name: 'linux : allow snmp daemon hardware reads'
  become: true
  copy:
    content: >
      {{ snmp_deamon_user }} ALL=(root) NOPASSWD:
      {{ snmp_extension_hw_sudo_commands | join(', ') }}
    dest: /etc/sudoers.d/snmp-hardware
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
  when:
    - snmp_deamon_user is defined
    - snmp_extension_hw_sudo_commands is defined
    - snmp_extension_hw_sudo_commands | length > 0
  tags:
    - configuration

- name: 'linux : install snmp extension'
  become: true
  get_url:
    url: '{{ item.url }}'
    dest: '{{ snmp_extension_scripts + "/" }}'
    owner: root
    group: "{{ snmp_deamon_group | default('root') }}"
    mode: 0755
    seuser: system_u
    serole: object_r
    setype: lib_t
    selevel: s0
  with_items:
    - "{{ snmp_extension_list }}"
  tags:
    - configuration

- name: linux configure snmpd daemon
  become: true
  template:
    src: 'default/snmpd.{{ ansible_facts["os_family"] }}.j2'
    dest: '{{ snmp_daemon_config }}'
    owner: root
    group: root
    mode: 0644
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  notify:
    - restart snmp

- name: 'linux : check create snmp config'
  become: true
  template:
    src: 'snmp/snmpd.conf.j2'
    dest: '{{ snmp_config }}'
    owner: root
    group: root
    mode: 0600
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  register: check_snmp
  check_mode: true
  tags:
    - configuration

- block:

    - name: 'linux : stopped snmp'
      become: true
      service:
        name: '{{ snmp_service_name }}'
        state: stopped

    - name: 'linux : create snmp config'
      become: true
      template:
        src: 'snmp/snmpd.conf.j2'
        dest: '{{ snmp_config }}'
        owner: root
        group: root
        mode: 0600
        seuser: system_u
        serole: object_r
        setype: etc_t
        selevel: s0
      notify:
        - restart snmp
        - enabled snmp

    - name: 'linux : started snmp'
      become: true
      service:
        name: '{{ snmp_service_name }}'
        state: started

  when: check_snmp.changed
  tags:
    - configuration

- name: 'linux : install and configure lldpd'
  include_tasks: lldpd.yml
  when: snmp_lldpd_enabled
  tags:
    - configuration

- name: 'linux : configure detected application extensions'
  include_tasks: Linux-applications.yml
  when:
    - snmp_application_extensions_enabled
    - snmp_config_include_dir_enabled
  tags:
    - configuration

- name: 'linux : apply snmp changes before application validation'
  meta: flush_handlers
  when:
    - snmp_application_extensions_enabled
    - snmp_config_include_dir_enabled
    - snmp_application_validate_snmp_output
  tags:
    - configuration

- name: 'linux : validate application extension snmp output'
  include_tasks: applications-validate.yml
  when:
    - snmp_application_extensions_enabled
    - snmp_config_include_dir_enabled
    - snmp_application_validate_snmp_output
  tags:
    - configuration
