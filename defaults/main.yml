---
# defaults file for sbaerlocher.snmp

snmp_additional_packages: []
snmp_encryption: snmp_encryption
snmp_extension_scripts: '/usr/local/lib/snmpd'
snmp_logging_options: ''
snmp_password: snmp_password
snmp_user: snmp
snmp_config_include_dir: /etc/snmp/snmpd.conf.d
snmp_config_include_dir_enabled: true

# SNMPv1/v2c community sources. Keep IPv4 and IPv6 separate because Net-SNMP
# uses rocommunity for IPv4 and rocommunity6 for IPv6.
snmp_source:
  - 127.0.0.1
  - 10.0.0.0/8
  - 192.168.0.0/16
snmp_source6:
  - '::1'

snmp_max_getbulk_responses: 100
snmp_sys_services: 72
snmp_storage_use_nfs: 1
snmp_skip_nfs_in_host_resources: true
snmp_include_all_disks: '10%'
snmp_diskio_exclude_fd: true
snmp_diskio_exclude_loop: true
snmp_diskio_exclude_ram: true
snmp_include_ifmib_iface_prefix:
  - lo
  - en
  - eth
  - bond
  - vmbr
snmp_agentx_enabled: true
snmp_agentx_socket_perms: '0660'
snmp_agentx_dir_perms: '0770'
snmp_agentx_user: root

snmp_agentadress_protocol:
  ipv4: udp
  ipv6: udp6
snmp_agentadress_adress:
  ipv4: >-
    {{ ansible_facts['default_ipv4']['address']
       if ansible_facts['default_ipv4']['address'] is defined
       else '127.0.0.1' }}
  ipv6: >-
    {{ ansible_facts['default_ipv6']['address']
       if ansible_facts['default_ipv6']['address'] is defined
       else '::1' }}
snmp_agentadress_port:
  ipv4: 161
  ipv6: 161

snmp_extension_list:
  - url: >-
      https://raw.githubusercontent.com/librenms/librenms-agent/master/snmp/distro
    extend: >-
      .1.3.6.1.4.1.2021.7890.1 distro {{ snmp_extension_scripts }}/distro

snmp_application_extensions_enabled: true
snmp_application_extension_scripts: '{{ snmp_extension_scripts }}/applications'
snmp_application_cache_dir: /run/snmp/extension
snmp_application_validate_snmp_output: true
snmp_application_validate_snmp_host: '{{ snmp_agentadress_adress.ipv4 }}'
snmp_application_apache_enabled: true
snmp_application_nginx_enabled: true
snmp_application_mysql_enabled: true
snmp_application_redis_enabled: true
snmp_application_memcached_enabled: true
snmp_application_fail2ban_enabled: true
snmp_application_fail2ban_cache_file: '{{ snmp_application_cache_dir }}/fail2ban'
snmp_application_smart_cache_file: '{{ snmp_application_cache_dir }}/smart'
snmp_application_smart_config_file: /etc/snmp/extension/smart.config
snmp_application_smart_smartctl: /usr/bin/env smartctl
snmp_application_smart_use_sn: 1
snmp_application_smart_devices: []
snmp_application_chronyd_enabled: true
snmp_application_docker_enabled: true
snmp_application_systemd_enabled: true
snmp_application_borgbackup_enabled: true
snmp_application_mdadm_enabled: true
snmp_application_nfs_enabled: true
snmp_application_osupdate_enabled: true
snmp_application_pihole_enabled: true
snmp_application_proxmox_enabled: true
snmp_application_smart_enabled: true
snmp_application_nvidia_gpu_enabled: true
snmp_application_ups_nut_enabled: true

snmp_extension_os_hw_serie:
  - >-
    .1.3.6.1.4.1.2021.7890.2 hardware
    /bin/cat /sys/devices/virtual/dmi/id/product_name
  - >-
    .1.3.6.1.4.1.2021.7890.3 vendor
    /bin/cat /sys/devices/virtual/dmi/id/sys_vendor
  - >-
    .1.3.6.1.4.1.2021.7890.4 serial
    /bin/cat /sys/devices/virtual/dmi/id/product_serial
