---
# vars file for sbaerlocher.snmp

snmp_packages:
  - snmp
  - snmpd
  - sudo

snmp_config: '/etc/snmp/snmpd.conf'
snmp_daemon_config: '/etc/default/snmpd'
snmp_deamon_group: 'Debian-snmp'
snmp_deamon_user: 'Debian-snmp'
snmp_logging_options: '-Lsw'
snmp_service_name: 'snmpd'

snmp_extension_os_hw_serie:
  - >-
    .1.3.6.1.4.1.2021.7890.2 hardware
    /usr/bin/sudo -n /bin/cat /sys/devices/virtual/dmi/id/product_name
  - >-
    .1.3.6.1.4.1.2021.7890.3 vendor
    /usr/bin/sudo -n /bin/cat /sys/devices/virtual/dmi/id/sys_vendor
  - >-
    .1.3.6.1.4.1.2021.7890.4 serial
    /usr/bin/sudo -n /bin/cat /sys/devices/virtual/dmi/id/product_serial

snmp_extension_hw_sudo_commands:
  - /bin/cat /sys/devices/virtual/dmi/id/product_name
  - /bin/cat /sys/devices/virtual/dmi/id/sys_vendor
  - /bin/cat /sys/devices/virtual/dmi/id/product_serial
