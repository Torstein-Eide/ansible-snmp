---
# vars file for Raspberry Pi (Raspbian / Raspberry Pi OS)

snmp_packages:
  - snmp
  - snmpd
  - sudo

snmp_config: '/etc/snmp/snmpd.conf'
snmp_daemon_config: '/etc/default/snmpd'
snmp_deamon_group: 'Debian-snmp'
snmp_deamon_user: 'Debian-snmp'
snmp_logging_options: '-Lsw'
snmp_service_name: 'snmpd'

# Device-tree files are world-readable; wrapper scripts strip the trailing
# null byte that the kernel includes in device-tree string properties.
snmp_extension_os_hw_serie:
  - >-
    .1.3.6.1.4.1.2021.7890.2 hardware
    {{ snmp_extension_scripts }}/rpi-model
  - >-
    .1.3.6.1.4.1.2021.7890.3 vendor
    /bin/echo "Raspberry Pi Foundation"
  - >-
    .1.3.6.1.4.1.2021.7890.4 serial
    {{ snmp_extension_scripts }}/rpi-serial

snmp_extension_hw_sudo_commands: []
