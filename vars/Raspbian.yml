---
# vars file for

snmp_packages:
  - snmp
  - snmpd

snmp_config: '/etc/snmp/snmpd.conf'
snmp_daemon_config: '/etc/default/snmpd'
snmp_deamon_group: 'Debian-snmp'
snmp_deamon_user: 'Debian-snmp'
snmp_logging_options: '-Lsw'
snmp_service_name: 'snmpd'

snmp_extension_os_hw_serie:
  - .1.3.6.1.4.1.2021.7890.2 hardware /bin/cat  /sys/firmware/devicetree/base/model
  - .1.3.6.1.4.1.2021.7890.3 vendor   /bin/echo "Raspberry Pi Foundation"
  - .1.3.6.1.4.1.2021.7890.4 serial /bin/cat /sys/firmware/devicetree/base/serial-number
